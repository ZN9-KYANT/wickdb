[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "candledb"
version = "0.1.0"
description = "Open-source candlestick pattern database and detection engine for quantitative analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kory", email = "zunku@users.noreply.github.com"},
]
keywords = [
    "candlestick",
    "kline",
    "patterns",
    "quantitative",
    "finance",
    "trading",
    "ohlc",
    "ohlcv",
]
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.20"]
detect = ["yfinance>=0.2"]
dev = [
    "jsonschema>=4.20",
    "yfinance>=0.2",
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
candledb = "candledb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]