id: bearish_harami_cross
name: Bearish Harami Cross
category: bearish
subcategory: reversal
type: unique
probability: moderate

structure:
  candles: 2
  requirements:
    - candle:
        index: 0
        trend: uptrend_required
        body_size: large
        color: bullish
    - candle:
        index: 1
        body_size: small
        color: any
        doji: true

parameters:
  min_body_ratio: 0.0
  max_body_ratio: 0.05  # doji body
  large_body_ratio: 0.60
  gap_threshold: 0.001

context:
  prior_trend:
    required: true
    direction: uptrend
    min_lookback: 3
  volume:
    recommended: false
    description: "Doji on candle 1 reflects indecision; stronger signal than bearish harami"

visual:
  ascii: |
    ┌───┐
    │▓▓▓│  ← Candle 0: large bullish (uptrend)
    │┌─┐│
    ││ ││  ← Candle 1: doji contained within candle 0
    │└─┘│
    └───┘

signal:
  direction: bearish
  action: watch
  stop_loss: above_candle_0_high
  target: recent_swing_low

backtest: []

references:
  - title: "Japanese Candlestick Charting Techniques"
    author: "Steve Nison"
    year: 1991

tags:
  - reversal
  - two-candle
  - bearish
  - harami
  - harami-cross
  - doji
  - uptrend