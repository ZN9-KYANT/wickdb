id: dragonfly_doji
name: Dragonfly Doji
category: bearish
subcategory: reversal
type: unique
probability: moderate

structure:
  candles: 1
  requirements:
    - candle:
        index: 0
        trend: uptrend_required
        body_size: small
        color: any
        doji: true
        lower_shadow: long
        upper_shadow: none

parameters:
  min_body_ratio: 0.0
  max_body_ratio: 0.05  # doji body
  shadow_ratio: 2.0  # lower shadow >= 2x body
  gap_threshold: 0.001

context:
  prior_trend:
    required: true
    direction: uptrend
    min_lookback: 3
  volume:
    recommended: true
    description: "Higher volume on dragonfly doji increases reliability"

visual:
  ascii: |
    ┌─┐
    │ │  ← Open & close at or near the high (doji)
    └─┘
    │ │
    │ │  ← Long lower shadow (>= 2x body)
    │ │
    └─┘

signal:
  direction: bearish
  action: watch
  stop_loss: above_dragonfly_doji_high
  target: recent_swing_low

backtest: []

references:
  - title: "Japanese Candlestick Charting Techniques"
    author: "Steve Nison"
    year: 1991
  - title: "Encyclopedia of Candlestick Charts"
    author: "Thomas Bulkowski"
    year: 2008

tags:
  - reversal
  - single-candle
  - bearish
  - dragonfly-doji
  - doji
  - uptrend
  - lower-shadow