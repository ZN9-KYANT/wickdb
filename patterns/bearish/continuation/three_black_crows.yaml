id: three_black_crows
name: Three Black Crows
category: bearish
subcategory: continuation
type: essential
probability: high

structure:
  candles: 3
  requirements:
    - candle:
        index: 0
        body_size: large
        color: bearish
    - candle:
        index: 1
        body_size: large
        color: bearish
        gap_down: true
    - candle:
        index: 2
        body_size: large
        color: bearish
        gap_down: true

parameters:
  min_body_ratio: 0.30
  large_body_ratio: 0.60
  gap_threshold: 0.001

context:
  prior_trend:
    required: false
  volume:
    recommended: true
    description: "Volume should increase with each successive candle"

visual:
  ascii: |
    ┌───┐
    │███│  ← Candle 0: large bearish (top)
    └───┘
    ┌───┐
    │███│  ← Candle 1: large bearish, opens below candle 0 open
    └───┘
    ┌───┐
    │███│  ← Candle 2: large bearish, opens below candle 1 open
    └───┘

signal:
  direction: bearish
  action: sell
  stop_loss: above_candle_0_high
  target: previous_support

backtest: []

references:
  - title: "Japanese Candlestick Charting Techniques"
    author: "Steve Nison"
    year: 1991

tags:
  - continuation
  - three-candle
  - bearish
  - three-black-crows