id: three_white_soldiers
name: Three White Soldiers
category: bullish
subcategory: continuation
type: essential
probability: high

structure:
  candles: 3
  requirements:
    - candle:
        index: 0
        body_size: large
        color: bullish
    - candle:
        index: 1
        body_size: large
        color: bullish
        gap_up: true
    - candle:
        index: 2
        body_size: large
        color: bullish
        gap_up: true

parameters:
  min_body_ratio: 0.30
  large_body_ratio: 0.60
  gap_threshold: 0.001

context:
  prior_trend:
    required: false
  volume:
    recommended: true
    description: "Volume should increase with each successive candle"

visual:
  ascii: |
    ┌───┐
    │▓▓▓│  ← Candle 2: large bullish, opens above candle 1 open
    └───┘
    ┌───┐
    │▓▓▓│  ← Candle 1: large bullish, opens above candle 0 open
    └───┘
    ┌───┐
    │▓▓▓│  ← Candle 0: large bullish (bottom)
    └───┘

signal:
  direction: bullish
  action: buy
  stop_loss: below_candle_0_low
  target: previous_resistance

backtest: []

references:
  - title: "Japanese Candlestick Charting Techniques"
    author: "Steve Nison"
    year: 1991

tags:
  - continuation
  - three-candle
  - bullish
  - three-white-soldiers