id: hammer
name: Hammer
category: bullish
subcategory: reversal
type: essential
probability: moderate

structure:
  candles: 1
  requirements:
    - candle:
        index: 0
        trend: downtrend_required
        body_size: small
        color: any
        lower_shadow: long
        upper_shadow: short

parameters:
  min_body_ratio: 0.05
  max_body_ratio: 0.30
  shadow_ratio: 2.0  # lower shadow >= 2x body
  gap_threshold: 0.001

context:
  prior_trend:
    required: true
    direction: downtrend
    min_lookback: 3
  volume:
    recommended: true
    description: "Higher volume on hammer candle increases reliability"

visual:
  ascii: |
    ┌─┐
    │ │  ← Small body (top of range)
    └─┘
    │ │
    │ │  ← Long lower shadow (>= 2x body)
    │ │
    └─┘

signal:
  direction: bullish
  action: buy
  stop_loss: below_hammer_low
  target: recent_swing_high

backtest: []

references:
  - title: "Japanese Candlestick Charting Techniques"
    author: "Steve Nison"
    year: 1991

tags:
  - reversal
  - single-candle
  - bullish
  - hammer
  - downtrend
  - lower-shadow